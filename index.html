<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Right-Click Inline Editor with Diff (Load HTML File)</title>
  <!-- Load jsdiff version 4.0.2 (exposes global "Diff") -->
  <script src="https://cdn.jsdelivr.net/npm/diff@4.0.2/dist/diff.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    td {
      border: 1px solid #000;
      vertical-align: top;
      padding: 10px;
    }
    /* Part 1 and Part 3: 45% width, 500px height with scrolling */
    #part1, #part3 {
      width: 45%;
      height: 500px;
      overflow: auto;
    }
    /* Part 2: 10% width, blank container */
    #part2 {
      width: 10%;
      height: 500px;
      background: #fff;
    }
    /* Diff styling: additions and removals */
    ins.added {
      background-color: #a6f3a6;
      text-decoration: none;
    }
    del.removed {
      background-color: #f3a6a6;
      text-decoration: line-through;
    }
    /* Inline editor styling */
    .inline-editor {
      margin-top: 5px;
      padding: 5px;
      background: #f9f9f9;
      border: 1px solid #666;
    }
    .inline-editor textarea {
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<h1>Right-Click Inline Editor with Diff</h1>
<!-- File input control to load your HTML file -->
<input type="file" id="fileInput" accept=".html">
<button onclick="loadHTML()">Load HTML</button>
<br><br>

<table>
  <tr>
    <!-- Part 1: Original HTML (read-only) -->
    <td id="part1">
      <h2>Original HTML</h2>
      <div id="originalHTML">No file loaded</div>
    </td>
    <!-- Part 2: Summary area (blank) -->
    <td id="part2">
      <h2>Summary</h2>
      <div id="summaryContent"></div>
    </td>
    <!-- Part 3: Editable Diff View -->
    <td id="part3">
      <h2>Editable Copy (Right-Click to Edit)</h2>
      <div id="editableHTML">No file loaded</div>
    </td>
  </tr>
</table>

<script>
  // Global variables to store plain HTML content (without diff markup)
  let originalContent = "";
  let editedContent = "";

  // Utility: Assign unique data-id attributes to each <p> element in a container.
  function assignParagraphIds(container) {
    let id = 1;
    container.querySelectorAll("p").forEach(p => {
      p.setAttribute("data-id", id++);
    });
  }

  // Utility: Normalize HTML content by adding data-id attributes to all paragraphs.
  function normalizeContent(htmlString) {
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = htmlString;
    assignParagraphIds(tempDiv);
    return tempDiv.innerHTML;
  }

  // Load HTML from file input.
  function loadHTML() {
    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];
    if (!file) {
      alert("Please select an HTML file.");
      return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      // Load and normalize the file content.
      originalContent = normalizeContent(e.target.result);
      document.getElementById("originalHTML").innerHTML = originalContent;
      // Initially, the edited content equals the original.
      editedContent = originalContent;
      // Clear the summary area.
      document.getElementById("summaryContent").innerHTML = "";
      // Render the diff view.
      renderEditableCopy();
    };
    reader.readAsText(file);
  }

  // Render the diff view in Part 3 by comparing originalContent and editedContent.
  function renderEditableCopy() {
    const diff = Diff.diffWords(originalContent, editedContent);
    let diffHTML = "";
    diff.forEach(part => {
      if (part.added) {
        diffHTML += `<ins class="added">${part.value}</ins>`;
      } else if (part.removed) {
        diffHTML += `<del class="removed">${part.value}</del>`;
      } else {
        diffHTML += part.value;
      }
    });
    const editableDiv = document.getElementById("editableHTML");
    editableDiv.innerHTML = diffHTML;
    // Reassign data-id attributes to paragraphs in Part 3.
    assignParagraphIds(editableDiv);
    attachContextMenuEditors();
  }

  // Attach a right-click (contextmenu) event listener to each paragraph in Part 3.
  function attachContextMenuEditors() {
    document.querySelectorAll("#editableHTML p[data-id]").forEach(p => {
      p.addEventListener("contextmenu", function(e) {
        e.preventDefault();
        e.stopPropagation();
        removeInlineEditors();
        createInlineEditor(this);
        return false;
      });
    });
  }

  // Remove any inline editor containers.
  function removeInlineEditors() {
    document.querySelectorAll(".inline-editor").forEach(editor => editor.remove());
  }

  // Create an inline editor for the target element (in Part 3).
  function createInlineEditor(targetElement) {
    const currentText = targetElement.innerText;
    const editorDiv = document.createElement("div");
    editorDiv.className = "inline-editor";
    const textarea = document.createElement("textarea");
    textarea.value = currentText;
    const submitBtn = document.createElement("button");
    submitBtn.textContent = "Submit";
    submitBtn.addEventListener("click", function(e) {
      e.stopPropagation();
      const newText = textarea.value;
      const dataId = targetElement.getAttribute("data-id");
      // Update the corresponding paragraph in the plain editedContent.
      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = editedContent;
      const targetPlain = tempDiv.querySelector(`p[data-id="${dataId}"]`);
      if (targetPlain) {
        targetPlain.innerHTML = newText;
        // Normalize again to keep data-id attributes.
        editedContent = normalizeContent(tempDiv.innerHTML);
      }
      removeInlineEditors();
      renderEditableCopy();
    });
    editorDiv.appendChild(textarea);
    editorDiv.appendChild(submitBtn);
    targetElement.appendChild(editorDiv);
    textarea.focus();
  }
</script>

</body>
</html>
